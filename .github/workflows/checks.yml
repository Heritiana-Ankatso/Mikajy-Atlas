name: Mikajy checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unit tests (maths, recogniser, calculator, settings, storage, updates)
        run: node --test tests/*.test.cjs
      - name: Build the offline page and check CSP / no-eval / syntax
        run: python3 tests/build_check.py
      - name: Install browser-test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser smoke test (worker + fallback inference, CSP, hostile storage, no network)
        run: python3 tests/browser_smoke.py
      - name: Drawn-stroke end-to-end test (recogniser, exponents, answer)
        run: python3 tests/browser_strokes.py
      - name: Update UI test (mocked Android bridge)
        run: python3 tests/browser_updates.py
      - name: Browser test (unlimited board, pan and zoom)
        run: python3 tests/browser_canvas.py
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openjdk-21-jdk-headless aapt zipalign \
            android-sdk-platform-23 dalvik-exchange python3
      - name: Update checker (compile with -Werror, parser and URL guard tests)
        run: bash scripts/test-update-checker.sh
      - name: Compile and package (unsigned, verification only)
        env:
          MIKAJY_UNSIGNED_ONLY: '1'
        run: ./build_apk.sh
