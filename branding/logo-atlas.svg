<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><title>Mikajy Atlas</title>
  <!-- Mikajy Atlas logo: the full edition. Red / black / white only.
       The same tile, black / red split and chevrons as Mikajy Spark (each chevron 190 deep, 444 tall, 190 apart, 96 white mitred stroke),
       but four identical solid chevrons held between two horizontal bars in the same stroke. The group is scaled 0.74 about the centre.
       Plain paths, no font. -->
